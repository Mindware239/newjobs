; PHP limits for the live server (read by PHP-FPM / LiteSpeed / CGI hosts such as Hostinger; ignored by XAMPP's mod_php).
; Mentor demo videos can be up to 200 MB (RegistrationValidator::VIDEO_MAX_BYTES).
upload_max_filesize = 210M
post_max_size = 220M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
