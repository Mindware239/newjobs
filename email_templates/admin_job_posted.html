<h1 style="color: #111827; font-size: 24px; font-weight: 700; margin-bottom: 20px;">New Job Posted</h1>
<p>Hello Admin,</p>
<p>A new job requirement has been published on the platform by <strong>{{company_name}}</strong>.</p>
<div style="background-color: #f9fafb; padding: 25px; border-radius: 8px; margin: 30px 0; border: 1px solid #e5e7eb;">
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="font-size: 15px;">
        <tr>
            <td width="150" style="padding: 5px 0; color: #6b7280;"><strong>Job Title:</strong></td>
            <td style="padding: 5px 0; color: #111827;">{{job_title}}</td>
        </tr>
        <tr>
            <td style="padding: 5px 0; color: #6b7280;"><strong>Employer:</strong></td>
            <td style="padding: 5px 0; color: #111827;">{{company_name}} (User: {{user_name}})</td>
        </tr>
        <tr>
            <td style="padding: 5px 0; color: #6b7280;"><strong>Location:</strong></td>
            <td style="padding: 5px 0; color: #111827;">{{job_location}}</td>
        </tr>
        <tr>
            <td style="padding: 5px 0; color: #6b7280;"><strong>Posted At:</strong></td>
            <td style="padding: 5px 0; color: #111827;">{{post_date}}</td>
        </tr>
    </table>
</div>
<div style="text-align: center; margin: 35px 0;">
    <a href="{{app_url}}/admin/jobs" class="btn" style="display: inline-block; background-color: #111827; color: #ffffff; padding: 14px 30px; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 16px;">Approve/Review Job</a>
</div>
<p>Regards,<br />System Automator</p>
