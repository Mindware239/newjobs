<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; color: #1e293b; margin: 0; padding: 0; background-color: #f8fafc; }
        .wrapper { width: 100%; table-layout: fixed; background-color: #f8fafc; padding-bottom: 40px; }
        .main { background-color: #ffffff; margin: 0 auto; width: 100%; max-width: 600px; border-spacing: 0; color: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { background-color: #ffffff; padding: 25px 40px; border-bottom: 1px solid #f1f5f9; text-align: left; }
        .content { padding: 40px; }
        .footer { background-color: #0f172a; padding: 40px; text-align: center; color: #94a3b8; font-size: 13px; }
        .btn { display: inline-block; padding: 14px 32px; background-color: #ff5a36; color: #ffffff !important; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 15px; margin: 10px 5px; transition: all 0.2s; }
        .btn-secondary { background-color: #0f172a; }
        .card { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 25px; margin-bottom: 25px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .badge-success { background-color: #dcfce7; color: #15803d; }
        .badge-primary { background-color: #ff5a36; color: #ffffff; }
        h1, h2, h3 { color: #0f172a; margin-top: 0; font-weight: 800; }
        p { margin-bottom: 16px; color: #475569; font-size: 15px; }
        @media only screen and (max-width: 600px) {
            .content { padding: 25px !important; }
            .header { padding: 20px !important; }
            .btn { width: 100%; box-sizing: border-box; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <center>
            <table class="main" width="100%">
                <tr>
                    <td class="header">
                        <table width="100%">
                            <tr>
                                <td width="50%">
                                    <img src="{{logo_url}}" alt="Jobsence" width="160" style="display: block; object-fit: contain;">
                                </td>
                                <td width="50%" align="right" style="color: #64748b; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">
                                    Recruitment Platform
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td class="content">
                        {{content_html}}
                    </td>
                </tr>
                <tr>
                    <td class="footer">
                        <img src="{{logo_url_white}}" alt="Jobsence" width="120" style="margin-bottom: 20px; opacity: 0.8; filter: brightness(0) invert(1);">
                        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 10px;">Empowering Careers & Streamlining Hiring</p>
                        

                        <div style="margin-bottom: 20px;">
                            <a href="{{app_url}}" style="color: #ffffff; text-decoration: none; margin: 0 10px;">Website</a>
                            <a href="{{app_url}}/jobs" style="color: #ffffff; text-decoration: none; margin: 0 10px;">Browse Jobs</a>
                            <a href="{{app_url}}/privacy" style="color: #ffffff; text-decoration: none; margin: 0 10px;">Privacy Policy</a>
                        </div>
                        <p style="color: #64748b; margin-bottom: 0;">&copy; {{year}} Jobsence. All rights reserved.</p>
                        <p style="color: #64748b; font-size: 11px; margin-top: 10px;">{{support_email}} | {{support_phone}}</p>
                        <p style="margin-top: 20px;"><a href="{{unsubscribe_link}}" style="color: #64748b; text-decoration: underline;">Unsubscribe from these notifications</a></p>
                    </td>
                </tr>
            </table>
        </center>
    </div>
</body>
</html>
