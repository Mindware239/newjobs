<h1 style="color: #111827; font-size: 24px; font-weight: 700; margin-bottom: 20px;">New Candidate Registration</h1>
<p>Hello Admin,</p>
<p>A new candidate has registered on the platform.</p>
<div style="background-color: #f9fafb; padding: 25px; border-radius: 8px; margin: 30px 0; border: 1px solid #e5e7eb;">
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="font-size: 15px;">
        <tr>
            <td width="150" style="padding: 5px 0; color: #6b7280;"><strong>Name:</strong></td>
            <td style="padding: 5px 0; color: #111827;">{{candidate_name}}</td>
        </tr>
        <tr>
            <td style="padding: 5px 0; color: #6b7280;"><strong>Email:</strong></td>
            <td style="padding: 5px 0; color: #111827;">{{candidate_email}}</td>
        </tr>
        <tr>
            <td style="padding: 5px 0; color: #6b7280;"><strong>Mobile:</strong></td>
            <td style="padding: 5px 0; color: #111827;">{{candidate_mobile}}</td>
        </tr>
        <tr>
            <td style="padding: 5px 0; color: #6b7280;"><strong>Source:</strong></td>
            <td style="padding: 5px 0; color: #111827;">{{registration_source}}</td>
        </tr>
        <tr>
            <td style="padding: 5px 0; color: #6b7280;"><strong>Profile Comp.:</strong></td>
            <td style="padding: 5px 0; color: #111827;">{{profile_completion}}%</td>
        </tr>
    </table>
</div>
<div style="text-align: center; margin: 35px 0;">
    <a href="{{app_url}}/admin/candidates" class="btn" style="display: inline-block; background-color: #111827; color: #ffffff; padding: 14px 30px; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 16px;">View Candidate in Admin</a>
</div>
<p>Regards,<br />System Automator</p>
