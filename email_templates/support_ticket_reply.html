<h1 style="color: #111827; font-size: 24px; font-weight: 700; margin-bottom: 20px;">New Reply to Your Ticket</h1>
<p>Hello {{user_name}},</p>
<p>A support representative has replied to your ticket <strong>#{{ticket_id}}</strong>.</p>
<div style="background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; margin: 30px 0; overflow: hidden;">
    <div style="padding: 20px; border-bottom: 1px solid #f3f4f6; background-color: #f9fafb;">
        <span style="font-weight: 700; color: #111827;">Support Agent Response:</span>
    </div>
    <div style="padding: 25px; color: #4b5563; line-height: 1.6;">
        {{reply_content}}
    </div>
</div>
<p>You can reply directly to this message or view the ticket in your dashboard.</p>
<div style="text-align: center; margin: 35px 0;">
    <a href="{{cta_link}}" class="btn" style="display: inline-block; background-color: #ff5a36; color: #ffffff; padding: 14px 30px; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 16px;">View Ticket & Reply</a>
</div>
<p>Best Regards,<br />Support Team, Jobsence</p>
