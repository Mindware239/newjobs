<h1 style="color: #111827; font-size: 24px; font-weight: 700; margin-bottom: 20px;">KYC Verification Update</h1>
<p>Hello {{user_name}},</p>
<p>Your KYC verification status has been updated.</p>
<div style="background-color: #f9fafb; padding: 25px; border-radius: 8px; margin: 30px 0; border: 1px solid #e5e7eb; text-align: center;">
    <p style="font-size: 14px; color: #6b7280; margin-bottom: 10px;">Current Status:</p>
    <span style="background-color: {{status_bg_color}}; color: {{status_text_color}}; padding: 8px 20px; border-radius: 99px; font-weight: 700; text-transform: uppercase;">{{kyc_status}}</span>
</div>
{{kyc_remarks_html}}
<div style="text-align: center; margin: 35px 0;">
    <a href="{{app_url}}/candidate/profile/kyc" class="btn" style="display: inline-block; background-color: #ff5a36; color: #ffffff; padding: 14px 30px; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 16px;">View KYC Details</a>
</div>
